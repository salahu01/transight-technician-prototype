<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transight Technician — Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Geist+Mono:wght@500;600&display=swap">
<style>
/* =====================================================================
   STARTER base.css — production-prototype skill
   1 tokens · 2 mode themes (EXAMPLES: replace colours per brief) · 3 type · 4 base
   5 device + Dynamic Island · 6 components · 7 stage (hero reactions) · 8 motion
   Add your screen CSS in a new "9. SCREENS" section below; don't edit engine rules in place.
   ===================================================================== */
/* ---------- 1. TOKENS ---------- */
:root{
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;--gut:20px;
  --r-sm:12px;--r-md:16px;--r-lg:22px;--r-xl:24px;--r-sheet:32px;--r-pill:999px;
  --d1:160ms;--d2:320ms;--d3:560ms;
  --ease:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --f:"Plus Jakarta Sans",system-ui,sans-serif;--m:"Geist Mono",ui-monospace,monospace;
}

/* ---------- 2. MODE THEMES (set on .phone[data-theme]) ---------- */
/* EXAMPLE default theme (dark): graphite + orange. Rename/recolour per mode. */
.phone{
  --bg:#0E0F11;--surface:#17191C;--surface-2:#22252A;--text:#F3F4F6;--text-2:#9AA0A8;--line:#2B2F35;
  --hair:#ffffff0f;--hair-2:#ffffff1a;
  --acc:#FF6A1A;--acc-2:#FF9A4D;--acc-ink:#1A0B03;--acc-soft:#FF6A1A24;--acc-t:#FF8C52;
  --glass:rgba(23,25,28,.76);--glass-line:rgba(255,255,255,.08);
  --sh-1:0 0 0 1px var(--hair),0 8px 22px -14px #000;--sh-2:0 18px 40px -16px #000;
  --ok:#2BD47F;--ok-bg:#2BD47F1F;--ok-ink:#5BE39C;--warn:#FF4D4D;--warn-bg:#FF4D4D1F;--warn-ink:#FF7A7A;
  --info:#4C9BFF;--info-bg:#4C9BFF1F;--info-ink:#8DBDFF;
  --floor:#1A1C20;--floor-2:#121316;--plate:#2A2E35;--metal-1:#E9EDF2;--metal-2:#8A929C;
  color-scheme:dark}
/* EXAMPLE second theme (light): warm daylight + teal */
.phone[data-theme="light"]{
  --bg:#F5F3EE;--surface:#FFFFFF;--surface-2:#ECE9E2;--text:#14171A;--text-2:#676C73;--line:#E1DED6;
  --hair:#0000000d;--hair-2:#00000014;
  --acc:#0FB59B;--acc-2:#3FD4B9;--acc-ink:#FFFFFF;--acc-soft:#0FB59B1F;--acc-t:#08876F;
  --glass:rgba(255,255,255,.78);--glass-line:rgba(255,255,255,.95);
  --sh-1:0 0 0 1px var(--hair),0 6px 18px -10px #00000026;--sh-2:0 18px 40px -18px #00000040;
  --ok:#1FB46E;--ok-bg:#1FB46E1F;--ok-ink:#0B7A47;--warn:#E5484D;--warn-bg:#E5484D1A;--warn-ink:#C22A2F;
  --info:#3B82C4;--info-bg:#3B82C41F;--info-ink:#276199;
  --floor:#E8E4DC;--floor-2:#DDD8CE;--plate:#D9D4CA;--metal-1:#FFFFFF;--metal-2:#A7ADB4;
  color-scheme:light}

/* ---------- 3. TYPE SCALE (the only font sizes in the app) ---------- */
.t-display{font:800 40px/44px var(--f);letter-spacing:-.03em;margin:0;text-wrap-style:balance}
.t-title{font:800 28px/32px var(--f);letter-spacing:-.025em;margin:0;text-wrap-style:balance}
.t-h{font:700 17px/22px var(--f);letter-spacing:-.015em;margin:0}
.t-body{font:500 16px/24px var(--f);margin:0;text-wrap-style:pretty}
.t-meta{font:500 13px/18px var(--f);margin:0}
.t-label{font:600 12px/16px var(--f)}
.t-btn{font:700 16px/20px var(--f)}
.t-num-xl{font:800 52px/56px var(--f);letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.t-num-l{font:700 24px/28px var(--f);letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.t-num{font:600 14px/20px var(--f);font-variant-numeric:tabular-nums}
.t-mono{font-family:var(--m);font-weight:500;letter-spacing:.01em}
.up{text-transform:uppercase;letter-spacing:.08em}
.mute{color:var(--text-2)}.ok-t{color:var(--ok-ink)}.warn-t{color:var(--warn-ink)}.acc-t{color:var(--acc-t)}

/* ---------- 4. BASE + UTILITIES ---------- */
@property --p{syntax:"<number>";inherits:false;initial-value:0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:#101215;color:#eee;font-family:var(--f);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:-80px;z-index:-1;filter:blur(70px);background:radial-gradient(50% 45% at 20% 30%,#5a2a12,transparent 70%),radial-gradient(45% 40% at 80% 75%,#0d4a43,transparent 70%),linear-gradient(180deg,#141619,#0c0d0f)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input{font-family:var(--f)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1,h2,h3,p{margin:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:var(--s3)}
.row.start{justify-content:flex-start}
.stack{display:grid;gap:var(--s3)}.stack-2{display:grid;gap:var(--s2)}.stack-1{display:grid;gap:var(--s1)}.stack-4{display:grid;gap:var(--s4)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}
.grow{flex:1;min-width:0}.center{text-align:center;justify-items:center}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic{width:24px;height:24px;flex:none}
.ic.s{width:18px;height:18px}.ic.xs{width:14px;height:14px}.ic.l{width:32px;height:32px}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes rot{to{rotate:360deg}}
@keyframes shake{25%{translate:-8px 0}50%{translate:8px 0}75%{translate:-4px 0}}
.shake{animation:shake .4s}

/* ---------- 5. STAGE + DEVICE ---------- */
.stage{height:100%;display:flex;align-items:center;justify-content:center;padding:72px var(--s4) 16px}
.simbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 24px;background:#1e1e1e;border-bottom:1px solid #000;z-index:10}
.simbar .dev{display:grid}.simbar .dev b{font:700 15px/18px -apple-system,var(--f);color:#fff}.simbar .dev span{font:400 12px/14px -apple-system,var(--f);color:#a1a1a1}
.ctrls{display:flex;gap:2px;padding:4px;border-radius:12px;background:#2a2a2a;box-shadow:inset 0 0 0 1px #3a3a3a}
.ctl{width:40px;height:34px;display:grid;place-items:center;border-radius:8px;color:#e8e8e8}.ctl:hover{background:#ffffff1f}
.ctl span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.fit{position:relative;flex:none}
.device{position:absolute;left:0;top:0;width:418px;height:890px;padding:8px;border-radius:66px;transform-origin:0 0;
  background:linear-gradient(145deg,#3c3c3f,#1c1c1e 30%,#2c2c2e 55%,#141416 80%,#38383a);box-shadow:0 40px 80px #0009,0 0 0 1px #000,inset 0 0 0 1.5px #5a5a5e,inset 0 0 3px #000}
.device::before,.device::after{content:"";position:absolute;width:4px;border-radius:2px;background:linear-gradient(90deg,#3a3632,#8d877f)}
.device::before{left:-4px;top:19%;height:7%;box-shadow:0 70px 0 #6d6760,0 130px 0 #6d6760}
.device::after{right:-4px;top:28%;height:11%}
/* desktop haptic fallback: uses translate/scale props, never transform (device uses transform for fit) */
.device.hx-error{animation:hxErr .4s}.device.hx-warning{animation:hxWarn .35s}.device.hx-success,.device.hx-heavy{animation:hxPulse .3s}
@keyframes hxErr{20%{translate:-2px 0}40%{translate:2px 0}60%{translate:-2px 0}80%{translate:1px 0}}
@keyframes hxWarn{30%{translate:0 -1.5px}60%{translate:0 1px}}
@keyframes hxPulse{40%{scale:1.004}}
.phone{width:402px;height:874px;background:var(--bg);color:var(--text);border-radius:58px;position:relative;overflow:hidden;isolation:isolate;transition:background-color var(--d3),color var(--d3)}
.status{height:54px;position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:4px 30px 0 40px;font:600 15px/20px -apple-system,"SF Pro Text",var(--f);z-index:40;color:var(--text);pointer-events:none}
.status .sig{display:flex;gap:6px;align-items:center}
.sf{position:absolute;top:0;left:0;right:0;height:56px;z-index:35;pointer-events:none;background:linear-gradient(180deg,var(--bg) 40%,transparent)}
.phone.nosf .sf{opacity:0}
.homebar{position:absolute;bottom:8px;left:50%;translate:-50% 0;width:136px;height:5px;border-radius:3px;background:var(--text);z-index:60;opacity:.85;pointer-events:none}

/* dynamic island (engine from reference; isl-* namespaced) */
.island{position:absolute;top:11px;left:50%;translate:-50% 0;width:124px;height:36px;background:#000;border-radius:20px;z-index:70;color:#fff;overflow:hidden;cursor:pointer;
  transition:width .5s var(--spring),height .5s var(--spring),border-radius .5s var(--spring),box-shadow .3s,translate .2s var(--ease);display:flex;align-items:center;padding:0 16px}
.island::after{content:"";position:absolute;right:14px;top:50%;width:11px;height:11px;translate:0 -50%;border-radius:50%;background:radial-gradient(circle at 35% 35%,#2a3550 0 20%,#0b0f1a 45%,#000 70%);transition:opacity .2s;pointer-events:none}
.island:is(.open,.big,.cmpt,.pre)::after{opacity:0}
.island .in{display:flex;align-items:center;gap:var(--s3);width:100%;opacity:0;transition:opacity var(--d1);white-space:nowrap;position:relative;padding:0 4px}
.island.open{width:370px;height:76px;border-radius:38px;box-shadow:0 14px 34px -14px color-mix(in srgb,var(--tint,#000) 75%,transparent),inset 0 0 0 1px #ffffff12}
.island.open .in{opacity:1;transition-delay:.18s}
.island.tall{height:96px;border-radius:40px}
.island.tall .isl-tx small{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.isl-ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--tint,#fff) 22%,transparent),0 6px 16px -6px var(--tint,#000)}
.isl-tx{min-width:0;flex:1;display:grid;gap:1px}
.isl-tx b{color:#fff;font:700 15px/19px var(--f);letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis}
.isl-tx small{font:500 12.5px/16px var(--f);color:#a9a49c;overflow:hidden;text-overflow:ellipsis}
.isl-act{flex:none;height:32px;padding:0 14px;border-radius:999px;color:#fff;font:600 13px/18px var(--f);box-shadow:inset 0 1px 0 #ffffff40;animation:txIn .45s .32s var(--ease) both}
.isl-pr{position:absolute;left:56px;right:20px;bottom:-14px;height:3px;border-radius:2px;background:#ffffff14;overflow:hidden}
.isl-pr::after{content:"";position:absolute;inset:0;background:var(--tint,#fff);transform-origin:left;animation:islPr var(--ms,2800ms) linear forwards;opacity:.8}
.island.hold .isl-pr::after{animation-play-state:paused}
@keyframes islPr{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.island.drop{animation:islDrop .62s var(--spring)}
@keyframes islDrop{0%{transform:translateY(-4px) scale(.96)}55%{transform:translateY(2px) scale(1.01)}100%{transform:none}}
.island.settle{animation:islSettle .45s var(--spring)}
@keyframes islSettle{0%{transform:scaleX(1.08) scaleY(.92)}100%{transform:none}}
.island.open .isl-ic{animation:icIn .55s .14s var(--spring) both}
.island.open .isl-tx b{animation:txIn .45s .2s var(--ease) both}
.island.open .isl-tx small{animation:txIn .45s .27s var(--ease) both}
@keyframes icIn{0%{transform:scale(.3) rotate(-35deg);opacity:0;filter:blur(4px)}100%{transform:none;opacity:1;filter:none}}
@keyframes txIn{0%{transform:translateY(6px);opacity:0;filter:blur(3px)}100%{transform:none;opacity:1;filter:none}}
.island .in.swap{animation:txIn .35s var(--ease)}
.island.closing .in{opacity:0!important;filter:blur(5px);transform:scale(.96);transition:opacity .17s,filter .17s,transform .17s;transition-delay:0s!important}
.island .cmp,.island .live{position:absolute;opacity:0;pointer-events:none;transition:opacity .2s}
.island.pre{width:210px;height:36px;border-radius:20px}
.island.cmpt:not(.open):not(.big):not(.pre){width:196px}
.island.cmpt:not(.open):not(.big):not(.pre) .cmp{opacity:1;transition-delay:.2s}
.cmp{left:8px;right:12px;top:0;bottom:0;display:flex;align-items:center;justify-content:space-between}
.isl-ring{width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),#ffffff26 0);-webkit-mask:radial-gradient(circle,transparent 6px,#000 6.5px);mask:radial-gradient(circle,transparent 6px,#000 6.5px)}
.isl-cm{display:flex;align-items:center;gap:6px}.isl-cm b{color:#fff;font-variant-numeric:tabular-nums}
.isl-dot{width:8px;height:8px;border-radius:50%;background:var(--c,#2BD47F);animation:breathe 1.6s ease-in-out infinite}
.island.big{width:378px;height:170px;border-radius:44px;box-shadow:0 18px 40px -16px #000c,inset 0 0 0 1px #ffffff12}
.island.big .live{opacity:1;pointer-events:auto;transition-delay:.22s}
.live{left:18px;right:18px;top:16px;bottom:16px;display:grid;gap:10px;align-content:start}
.island.big .live>*{animation:txIn .45s var(--ease) both}.island.big .live>*:nth-child(2){animation-delay:.05s}.island.big .live>*:nth-child(3){animation-delay:.1s}
.isl-top{display:flex;align-items:center;gap:12px}
.isl-pct{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),#ffffff1f 0);position:relative;flex:none}
.isl-pct::before{content:"";position:absolute;inset:4px;border-radius:50%;background:#000}.isl-pct b{position:relative;color:#fff;font:700 12px/16px var(--f)}
.isl-row{display:flex;justify-content:space-between;color:#b9b4ac}
.isl-acts{display:flex;gap:8px}
.isl-b{flex:1;height:34px;border-radius:999px;background:#ffffff1a;color:#fff;font:600 13px/18px var(--f);display:flex;align-items:center;justify-content:center;gap:4px}
.isl-b:hover{background:#ffffff26}.isl-b.acc{background:var(--acc);color:var(--acc-ink)}

/* ---------- 6. COMPONENTS ---------- */
.view{position:absolute;inset:0;z-index:2;overflow-y:auto;overflow-x:hidden;padding:60px var(--gut) 124px;display:flex;flex-direction:column;gap:var(--s4);scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.view>*{flex-shrink:0}
.phone.notabs .view{padding-bottom:0}
.view.full{padding:0;overflow:hidden;display:block}
.view.f{animation:inF var(--d3) var(--ease)}.view.b{animation:inB var(--d3) var(--ease)}
@keyframes inF{from{opacity:0;translate:28px 0}}
@keyframes inB{from{opacity:0;translate:-28px 0}}
.st{animation:rise var(--d3) var(--ease) both;animation-delay:calc(var(--i,0)*40ms)}
.view.still .st{animation:none}

/* docked CTA on screens without the tab bar */
.dock{position:sticky;bottom:0;margin:auto calc(var(--gut)*-1) 0;padding:var(--s4) var(--gut) 40px;z-index:5;display:grid;gap:var(--s3)}
.dock::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,transparent,var(--bg) 40%)}

/* sliver: compact bar pins once the big title scrolls away */
.cbar{position:sticky;top:-60px;z-index:20;margin:-60px calc(var(--gut)*-1) -36px;height:96px;padding:50px var(--gut) 0;display:flex;align-items:center;gap:var(--s3);
  background:var(--glass);backdrop-filter:blur(20px) saturate(1.5);box-shadow:0 1px 0 var(--hair-2);opacity:0;translate:0 -8px;pointer-events:none;transition:opacity var(--d2),translate var(--d2) var(--ease)}
.cbar.on{opacity:1;translate:0 0;pointer-events:auto}
.cbar .t-h{flex:1;min-width:0;text-align:center;padding-right:44px}
.cbar.nb .t-h{padding:0}
.cbar .icon-btn{width:40px;height:40px}

.press{position:relative;overflow:hidden;transition:transform var(--d1) var(--spring),opacity var(--d1)}
.press:active{transform:scale(.97) translateY(1px);opacity:.92}
.icon-btn.press:active{transform:scale(.9)}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.12;transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}

.btn{display:flex;align-items:center;justify-content:center;gap:var(--s2);white-space:nowrap;width:100%;min-height:54px;padding:0 var(--s5);border-radius:var(--r-pill);
  background:var(--text);color:var(--bg);font:700 16px/20px var(--f)}
.btn.brand{background:linear-gradient(180deg,var(--acc-2),var(--acc));color:var(--acc-ink);box-shadow:inset 0 1px 0 #ffffff55,0 10px 24px -12px var(--acc)}
.btn.ghost{background:var(--surface-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--hair)}
.btn.danger{background:var(--warn);color:#fff}
.btn.sm{width:auto;min-height:40px;padding:0 var(--s4);font:700 14px/18px var(--f)}
.btn:disabled{opacity:.35;pointer-events:none}
.icon-btn{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;color:var(--text);background:var(--glass);backdrop-filter:blur(16px);box-shadow:var(--sh-1),inset 0 0 0 1px var(--glass-line)}
.avatar{width:44px;height:44px;flex:none;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px var(--acc)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.lg{width:72px;height:72px;box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--acc)}

.card{background:var(--surface);border-radius:var(--r-lg);padding:var(--s4);box-shadow:var(--sh-1)}
.card.glass{background:var(--glass);backdrop-filter:blur(16px)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);padding:0 2px}
.sec>.t-label:first-child{text-transform:uppercase;letter-spacing:.08em;color:var(--text-2)}

/* grouped card list */
.txcard{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-1);overflow:hidden;display:grid}
.txr{display:grid;grid-template-columns:auto 1fr auto;gap:var(--s3);align-items:center;min-height:68px;padding:var(--s3) var(--s4);text-align:left;width:100%;position:relative}
.txr+.txr::before{content:"";position:absolute;top:0;left:72px;right:0;height:1px;background:var(--line)}
.txr .main{display:grid;min-width:0}
.txr .end{display:grid;justify-items:end;gap:2px}
.txr.press:active{background:var(--surface-2)}

.tile{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;background:var(--surface-2);color:var(--text)}
.tile.sm{width:36px;height:36px;border-radius:var(--r-sm)}.tile.xs{width:22px;height:22px;border-radius:7px}.tile.lg{width:56px;height:56px;border-radius:18px}
.tile.acc{background:var(--acc-soft);color:var(--acc-t)}.tile.ok{background:var(--ok-bg);color:var(--ok-ink)}
.tile.info{background:var(--info-bg);color:var(--info-ink)}.tile.warn{background:var(--warn-bg);color:var(--warn-ink)}
.tile.solid{background:var(--acc);color:var(--acc-ink)}

.badge{display:inline-flex;align-items:center;gap:var(--s1);padding:4px 10px;border-radius:var(--r-pill);background:var(--surface-2);color:var(--text);white-space:nowrap;animation:pillIn .4s var(--spring)}
.badge.ok{background:var(--ok-bg);color:var(--ok-ink)}.badge.warn{background:var(--warn-bg);color:var(--warn-ink)}
.badge.info{background:var(--info-bg);color:var(--info-ink)}.badge.acc{background:var(--acc-soft);color:var(--acc-t)}
.badge .ic{width:14px;height:14px}
@keyframes pillIn{from{scale:.7;opacity:0}}

.field{display:flex;align-items:center;gap:var(--s3);min-height:52px;padding:0 var(--s4);border-radius:var(--r-pill);background:var(--surface-2);color:var(--text);box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow var(--d2)}
.field:focus-within{box-shadow:inset 0 0 0 1.5px var(--acc),0 0 0 4px var(--acc-soft)}
.field input{flex:1;min-width:0;border:0;background:none;outline:0;color:inherit;font:500 16px/24px var(--f)}
.field input::placeholder{color:var(--text-2)}
.err-msg{display:flex;gap:6px;align-items:center;color:var(--warn-ink)}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:var(--r-pill);padding:4px;position:relative}
.seg .si{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/var(--n));background:var(--acc);border-radius:var(--r-pill);
  transition:transform var(--d3) cubic-bezier(.34,1.4,.64,1);transform:translateX(calc(var(--k)*100%));box-shadow:0 2px 8px -2px #0003}
.seg button{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 6px;border-radius:var(--r-pill);font:600 13px/18px var(--f);color:var(--text-2);transition:color var(--d2);white-space:nowrap}
.seg button.on{color:var(--acc-ink)}

.toggle{width:50px;height:30px;border-radius:var(--r-pill);background:var(--line);position:relative;transition:background var(--d2);flex:none}
.toggle::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:12px;background:#fff;box-shadow:0 2px 4px #0003;transition:transform var(--d2) var(--spring),width var(--d1)}
.toggle:active::after{width:30px}
.toggle[aria-checked="true"]{background:var(--ok)}.toggle[aria-checked="true"]::after{transform:translateX(20px)}
.toggle[aria-checked="true"]:active::after{transform:translateX(14px)}

.chips{display:flex;gap:var(--s2);overflow-x:auto;scrollbar-width:none;margin:0 calc(var(--gut)*-1);padding:2px var(--gut)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:var(--r-pill);background:var(--surface-2);font:600 13px/18px var(--f);color:var(--text-2);box-shadow:inset 0 0 0 1px var(--hair);white-space:nowrap}
.chip.on{background:var(--acc);color:var(--acc-ink);box-shadow:none;animation:popOn .35s var(--spring)}
@keyframes popOn{0%{scale:.97}60%{scale:1.015}100%{scale:1}}

.skel{background:linear-gradient(90deg,var(--surface-2) 25%,var(--line) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:sk 1.2s linear infinite;border-radius:var(--r-lg)}
@keyframes sk{to{background-position:-200% 0}}
.empty{display:grid;justify-items:center;text-align:center;gap:var(--s3);padding:var(--s6) var(--s4)}
.empty svg.art{width:150px;height:auto;animation:float 3.2s ease-in-out infinite}
@keyframes float{50%{translate:0 -6px}}

.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--acc);animation:fill .9s var(--ease) both}
@keyframes fill{from{width:0}}

.sheet{position:absolute;inset:0;z-index:50;display:flex;align-items:flex-end}
.sheet-bd{position:absolute;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(3px);animation:fade var(--d2)}
.sheet-pn{position:relative;width:100%;max-height:88%;overflow-y:auto;scrollbar-width:none;border-radius:var(--r-sheet) var(--r-sheet) 0 0;padding:0 var(--gut) 40px;
  background:var(--surface);color:var(--text);box-shadow:var(--sh-2);display:grid;gap:var(--s4);align-content:start;animation:up var(--d3) var(--spring)}
.sheet-pn::-webkit-scrollbar{display:none}
.sheet-pn>*:not(.grab){animation:rise .45s var(--ease) both}
.sheet-pn>*:nth-child(2){animation-delay:.04s}.sheet-pn>*:nth-child(3){animation-delay:.08s}.sheet-pn>*:nth-child(4){animation-delay:.12s}.sheet-pn>*:nth-child(5){animation-delay:.16s}.sheet-pn>*:nth-child(6){animation-delay:.2s}
.grab{height:26px;display:grid;place-items:center;touch-action:none;cursor:grab;margin:0 calc(var(--gut)*-1)}
.grab::before{content:"";width:40px;height:5px;border-radius:3px;background:var(--line);transition:width var(--d1)}
.grab:active::before{width:56px}
.sheet.out .sheet-pn{animation:down var(--d2) var(--ease) forwards}
.sheet.out .sheet-bd{animation:fadeout var(--d2) forwards}
@keyframes up{from{transform:translateY(100%)}}
@keyframes down{to{transform:translateY(100%)}}
@keyframes fadeout{to{opacity:0}}

/* floating tab bar */
.tabs{position:absolute;left:var(--s4);right:var(--s4);bottom:24px;height:68px;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);padding:6px;border-radius:var(--r-pill);
  background:var(--glass);backdrop-filter:blur(28px) saturate(1.6);box-shadow:var(--sh-2),inset 0 0 0 1px var(--glass-line);transition:transform var(--d3) var(--ease),opacity var(--d2)}
.tabs[hidden]{display:grid!important;transform:translateY(130%);opacity:0;pointer-events:none}
.tabs .ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/4);border-radius:var(--r-pill);background:var(--acc);transition:transform var(--d3) var(--spring),opacity var(--d2);z-index:0}
.tabs button{position:relative;z-index:1;display:grid;justify-items:center;align-content:center;gap:1px;color:var(--text-2);transition:color var(--d2);border-radius:var(--r-pill)}
.tabs button.on{color:var(--acc-ink)}
.tabs button.on .ic{animation:hop .5s var(--spring)}
.tabs button .ic{width:22px;height:22px}
@keyframes hop{40%{translate:0 -4px;scale:1.1}}

/* swipe-to-confirm */
.swipe{position:relative;height:62px;border-radius:var(--r-pill);background:linear-gradient(90deg,var(--acc),var(--acc-2));overflow:hidden;touch-action:none;user-select:none;flex:none}
.swipe .fill{position:absolute;inset:0;width:0;background:#0000001a}
.swipe .lbl{position:absolute;inset:0;display:grid;place-items:center;padding-left:40px;font:700 16px/20px var(--f);color:var(--acc-ink)}
.swipe::after{content:"›››";position:absolute;right:24px;top:50%;translate:0 -52%;font:600 22px/22px var(--f);letter-spacing:-1px;color:var(--acc-ink);animation:chev 1.6s ease-in-out infinite}
@keyframes chev{0%,100%{opacity:.25;transform:translateX(0)}50%{opacity:.7;transform:translateX(4px)}}
.swipe .knob{position:absolute;top:5px;left:5px;width:52px;height:52px;border-radius:50%;background:var(--acc-ink);display:grid;place-items:center;color:var(--acc);cursor:grab;z-index:2;box-shadow:0 4px 10px #0003}
.swipe.done .knob{background:var(--ok);color:#fff}
.swipe.snap .knob,.swipe.snap .fill{transition:all var(--d2) var(--spring)}

/* stage: hero object on a floor line with floating cards */
.stg{position:relative;border-radius:var(--r-xl);overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,var(--acc-soft),transparent 60%),var(--surface);box-shadow:var(--sh-1)}
.floor{position:absolute;left:0;right:0;bottom:0;height:56px;background:linear-gradient(180deg,var(--floor),var(--floor-2));border-top:1px solid var(--hair-2)}
.floor::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 46px,var(--hair) 46px 48px)}
.hero{position:absolute;left:50%;translate:-50% 0;transition:filter var(--d2)}
.hero svg{display:block;width:100%;height:auto;overflow:visible}
.hero .bb{transform-box:fill-box;transform-origin:50% 100%}
.hero.rep .bb{animation:rep .9s var(--ease)}
@keyframes rep{0%{transform:none}35%{transform:translateY(-34px)}45%{transform:translateY(-34px) scaleX(.995)}100%{transform:none}}
.hero.stall .bb{animation:stall .6s ease-out}
@keyframes stall{0%{transform:none}20%{transform:translateY(-14px)}30%{transform:translateY(-14px) translateX(-3px)}40%{transform:translateY(-12px) translateX(3px)}50%{transform:translateY(-13px) translateX(-2px)}100%{transform:none}}
.hero.hop .bb{animation:hopb .6s var(--spring)}
@keyframes hopb{40%{transform:translateY(-12px)}}
.hero.idle .bb{animation:idle 3.6s ease-in-out infinite}
@keyframes idle{50%{transform:translateY(-1.5px)}}
.shadow{transform-box:fill-box;transform-origin:50% 50%}
.hero.rep .shadow{animation:shad .9s var(--ease)}
@keyframes shad{35%,45%{opacity:.35;transform:scaleX(.7)}}
.fl{position:absolute;z-index:2;display:flex;align-items:center;gap:var(--s2);padding:8px 12px 8px 8px;border-radius:var(--r-pill);background:var(--glass);backdrop-filter:blur(14px);box-shadow:var(--sh-1),inset 0 0 0 1px var(--glass-line);animation:rise .6s var(--ease) both,float 4s ease-in-out 1s infinite}
.fl .tile{width:28px;height:28px;border-radius:50%}

/* ---------- 8. MOTION POLISH ---------- */
.bump{animation:bump .45s var(--spring)}
@keyframes bump{40%{scale:1.08;color:var(--acc-t)}}
.nd{animation:breathe 1.8s ease-in-out infinite}
@keyframes breathe{50%{opacity:.45}}
@media (hover:hover){.card.press:hover,.txcard:hover{translate:0 -2px;transition:translate var(--d2) var(--ease)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.splash{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:var(--s6);background:var(--bg);cursor:pointer}

/* ---------- 9. TRANSIGHT THEMES ----------
   disc  = Discovery family · warm field-daylight + Transight crimson (from logo #670824)
   comp  = Compass 4G family · night graphite + signal amber (AIS-140 / panic)
   brand = splash + sign-in · deep maroon                                                */
.phone,.phone[data-theme="disc"]{
  --bg:#F4F1EC;--surface:#FFFFFF;--surface-2:#EDE8E1;--text:#16110F;--text-2:#6E6660;--line:#E3DCD3;
  --hair:#0000000d;--hair-2:#00000014;
  --acc:#B3123F;--acc-2:#DA3F62;--acc-ink:#FFFFFF;--acc-soft:#B3123F17;--acc-t:#9A0F36;
  --glass:rgba(255,255,255,.8);--glass-line:rgba(255,255,255,.95);
  --sh-1:0 0 0 1px var(--hair),0 6px 18px -10px #3a0b1a26;--sh-2:0 18px 40px -18px #3a0b1a40;
  --ok:#14A35F;--ok-bg:#14A35F1C;--ok-ink:#0B7543;--warn:#E5484D;--warn-bg:#E5484D19;--warn-ink:#C0262C;
  --info:#2F7DD1;--info-bg:#2F7DD11C;--info-ink:#1F5FA6;--amb:#E39B0B;--amb-bg:#E39B0B1E;--amb-ink:#9A6600;
  --floor:#EAE4DB;--floor-2:#DED6CB;--case-1:#FBFAF8;--case-2:#C9C3BB;--case-3:#8E877F;--face:#221C1A;--stripe:#B3123F;
  color-scheme:light}
.phone[data-theme="comp"]{
  --bg:#0C0E11;--surface:#15181C;--surface-2:#1F2328;--text:#F2F3F5;--text-2:#949BA4;--line:#2A2F36;
  --hair:#ffffff0f;--hair-2:#ffffff1a;
  --acc:#FFB21A;--acc-2:#FFCB5C;--acc-ink:#1C1200;--acc-soft:#FFB21A1F;--acc-t:#FFC44D;
  --glass:rgba(21,24,28,.78);--glass-line:rgba(255,255,255,.07);
  --sh-1:0 0 0 1px var(--hair),0 8px 22px -14px #000;--sh-2:0 18px 40px -16px #000;
  --ok:#2BD47F;--ok-bg:#2BD47F1F;--ok-ink:#5BE39C;--warn:#FF5A5F;--warn-bg:#FF5A5F1F;--warn-ink:#FF8589;
  --info:#4C9BFF;--info-bg:#4C9BFF1F;--info-ink:#8DBDFF;--amb:#FFB21A;--amb-bg:#FFB21A1F;--amb-ink:#FFC44D;
  --floor:#171A1E;--floor-2:#101215;--case-1:#3A4048;--case-2:#20242A;--case-3:#0E1013;--face:#07080A;--stripe:#FFB21A;
  color-scheme:dark}
.phone[data-theme="brand"]{
  --bg:#1A040C;--surface:#2A0A15;--surface-2:#3A1220;--text:#FFF4F6;--text-2:#D7A9B5;--line:#4A1A29;
  --hair:#ffffff12;--hair-2:#ffffff1f;
  --acc:#FF5C7F;--acc-2:#FF8AA3;--acc-ink:#2A0612;--acc-soft:#FF5C7F24;--acc-t:#FF8AA3;
  --glass:rgba(42,10,21,.72);--glass-line:rgba(255,255,255,.08);
  --sh-1:0 0 0 1px var(--hair),0 8px 22px -14px #000;--sh-2:0 18px 40px -16px #000;
  --ok:#3BD68A;--ok-bg:#3BD68A22;--ok-ink:#6BE7A8;--warn:#FF6B6B;--warn-bg:#FF6B6B22;--warn-ink:#FF9C9C;
  --info:#7DB4FF;--info-bg:#7DB4FF22;--info-ink:#A9CCFF;--amb:#FFC24D;--amb-bg:#FFC24D22;--amb-ink:#FFD27A;
  --floor:#24070F;--floor-2:#16030A;--case-1:#FBFAF8;--case-2:#C9C3BB;--case-3:#8E877F;--face:#221C1A;--stripe:#B3123F;
  color-scheme:dark}
.phone{background:var(--bg);transition:background var(--d3)}
.tile.amb{background:var(--amb-bg);color:var(--amb-ink)}.badge.amb{background:var(--amb-bg);color:var(--amb-ink)}
.amb-t{color:var(--amb-ink)}

/* ---------- 10. BRAND (splash / login) ---------- */
.brandbg{position:absolute;inset:0;background:radial-gradient(90% 60% at 50% 0%,#7A0E2E 0%,transparent 70%),radial-gradient(70% 50% at 100% 100%,#4A0719,transparent 70%),var(--bg);overflow:hidden}
.brandbg::after{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 50% 38%,transparent 0 46px,#ffffff08 46px 47px);mask:radial-gradient(60% 45% at 50% 38%,#000,transparent)}
.logo{width:76px;height:auto;display:block;filter:drop-shadow(0 10px 24px #0008)}
.logo path{fill:#fff}.logo .lg-c{fill:#FF5C7F}
.splash .logo{width:92px;animation:logoIn 1s var(--spring) both}
@keyframes logoIn{0%{opacity:0;scale:.6;translate:0 30px}100%{opacity:1;scale:1;translate:0 0}}
.pulse-rings{position:absolute;left:50%;top:38%;width:0;height:0}
.pulse-rings i{position:absolute;left:-60px;top:-60px;width:120px;height:120px;border-radius:50%;border:1.5px solid #FF5C7F;opacity:0;animation:ring 2.6s var(--ease) infinite}
.pulse-rings i:nth-child(2){animation-delay:.85s}.pulse-rings i:nth-child(3){animation-delay:1.7s}
@keyframes ring{0%{opacity:.6;scale:.5}100%{opacity:0;scale:2.6}}
.loader{width:120px;height:4px;border-radius:2px;background:#ffffff1a;overflow:hidden}
.loader i{display:block;height:100%;width:40%;border-radius:2px;background:linear-gradient(90deg,#FF5C7F,#FFB0C2);animation:load 1.1s ease-in-out infinite}
@keyframes load{0%{translate:-100% 0}100%{translate:260% 0}}
.fams{display:flex;gap:8px;justify-content:center}
.login{position:absolute;inset:0;display:flex;flex-direction:column;padding:72px var(--gut) 40px;gap:var(--s4);z-index:1}
.login .hdr{display:grid;gap:var(--s3);justify-items:start;margin-bottom:var(--s2)}
.login .logo{width:52px}
.trust{display:flex;gap:6px;flex-wrap:wrap}
.cc{display:flex;align-items:center;gap:6px;padding-right:12px;margin-right:2px;border-right:1px solid var(--line);font:600 15px/20px var(--f)}
.flag{width:22px;height:15px;border-radius:3px;background:linear-gradient(#FF9933 0 33%,#fff 33% 66%,#138808 66%);position:relative;flex:none}
.flag::after{content:"";position:absolute;left:50%;top:50%;width:5px;height:5px;border-radius:50%;border:1px solid #000080;translate:-50% -50%}
.field.err{box-shadow:inset 0 0 0 1.5px var(--warn),0 0 0 4px var(--warn-bg)}
.err-msg{color:var(--warn-ink);font:600 13px/18px var(--f);display:flex;gap:6px;align-items:center;padding:0 6px}
.lnk{color:var(--acc-t);font:700 14px/18px var(--f)}
.envchip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--r-pill);background:var(--surface-2);font:600 12px/16px var(--f);color:var(--text-2);box-shadow:inset 0 0 0 1px var(--hair)}
.envchip .d{width:7px;height:7px;border-radius:50%;background:var(--amb)}.envchip.live .d{background:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}
.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.otp span{height:54px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;font:700 22px/1 var(--f);box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow var(--d2)}
.otp span.cur{box-shadow:inset 0 0 0 1.5px var(--acc),0 0 0 4px var(--acc-soft)}
.otp span.fill{animation:popOn .3s var(--spring)}
.autofill{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--hair);animation:rise .5s var(--ease) both}

/* ---------- 11. HOME ---------- */
.hello{display:flex;align-items:center;gap:var(--s3)}
.hello .avatar{width:48px;height:48px}
.ini{width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc-2),var(--acc));color:var(--acc-ink);font:800 16px/1 var(--f)}
.icon-btn .nd{position:absolute;top:9px;right:10px}
.nd{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 2px var(--surface)}
.hstage{height:236px}
.hstage .hero{bottom:22px;width:290px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi{background:var(--surface);border-radius:18px;padding:12px 10px;box-shadow:var(--sh-1);display:grid;gap:6px;text-align:left}
.kpi .t-num-l{line-height:26px}
.qa{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s3)}
.qa button{display:grid;gap:10px;align-content:start;text-align:left;padding:14px;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--sh-1);min-height:112px;position:relative}
.qa button .arr{position:absolute;right:12px;top:12px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--text-2)}
.qa button.hi{background:linear-gradient(150deg,var(--acc-2),var(--acc));color:var(--acc-ink)}
.qa button.hi .tile{background:#ffffff2e;color:var(--acc-ink)}.qa button.hi .mute{color:var(--acc-ink);opacity:.82}.qa button.hi .arr{background:#ffffff2e;color:var(--acc-ink)}
.resume{display:grid;grid-template-columns:auto 1fr auto;gap:var(--s3);align-items:center;padding:14px;border-radius:var(--r-lg);background:var(--amb-bg);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--amb) 30%,transparent);text-align:left;width:100%}

/* ---------- 12. JOB TILES ---------- */
.job{display:grid;gap:12px;padding:14px;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--sh-1);text-align:left;width:100%}
.job .top{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.job .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.job .foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;border-top:1px dashed var(--line)}
.plate{display:inline-flex;align-items:center;gap:0;border-radius:6px;background:#FFFFFF;color:#111;font:600 12.5px/1 var(--m);letter-spacing:.06em;box-shadow:0 0 0 1.5px #111,inset 0 0 0 3px #fff;padding:4px 7px 4px 4px;white-space:nowrap}
.plate::before{content:"IND";font:800 6px/1 var(--f);color:#fff;background:#1F4FB8;border-radius:2px;padding:6px 2px;margin-right:6px;writing-mode:vertical-rl;letter-spacing:0}
.plate.lg{font-size:22px;padding:8px 12px 8px 6px;border-radius:10px;box-shadow:0 0 0 2.5px #111,inset 0 0 0 4px #fff}
.plate.lg::before{font-size:9px;padding:9px 3px;margin-right:10px}
.steps{display:grid;grid-auto-flow:column;gap:3px;width:84px}
.steps i{height:5px;border-radius:3px;background:var(--surface-2)}
.steps i.on{background:var(--acc)}
.pri{display:inline-flex;align-items:center;gap:5px;font:700 11px/14px var(--f);text-transform:uppercase;letter-spacing:.06em}
.pri::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pri.high{color:var(--warn-ink)}.pri.medium{color:var(--amb-ink)}.pri.low{color:var(--text-2)}
.srch{display:flex;gap:10px}
.grp{display:flex;justify-content:space-between;padding:6px 2px 0}

/* ---------- 13. WIZARD ---------- */
.wtop{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:12px}
.wtop .ttl{display:grid;justify-items:center;text-align:center}
.wsteps{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:4px}
.wsteps i{height:4px;border-radius:2px;background:var(--surface-2);position:relative;overflow:hidden}
.wsteps i.on{background:var(--acc)}
.wsteps i.cur::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--acc),var(--acc-2));animation:fill .8s var(--ease) both;transform-origin:left}
.opt{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--sh-1);text-align:left;width:100%;transition:box-shadow var(--d2)}
.opt .rd{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);transition:box-shadow var(--d2) var(--spring)}
.opt.on{box-shadow:0 0 0 2px var(--acc),0 12px 28px -14px var(--acc);animation:popOn .35s var(--spring)}
.opt.on .rd{box-shadow:inset 0 0 0 7px var(--acc)}
.optg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.optg button{padding:12px 8px;border-radius:16px;background:var(--surface);box-shadow:var(--sh-1);display:grid;justify-items:center;gap:6px;font:600 12px/15px var(--f);text-align:center}
.optg button.on{box-shadow:0 0 0 2px var(--acc);color:var(--acc-t);animation:popOn .35s var(--spring)}
.devcard{display:grid;gap:14px;padding:16px;border-radius:var(--r-xl);background:var(--surface);box-shadow:var(--sh-1);position:relative;overflow:hidden}
.devcard::before{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(var(--acc-soft),transparent 70%)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.kv div{display:grid;gap:2px;min-width:0}

.term-b{font:500 11px/16px var(--m);max-height:220px;overflow:auto;display:grid;gap:12px;scrollbar-width:none}
.term .tp{color:#79C0FF}.term .tk{color:#7EE787}.term .tr{color:#E3B341;word-break:break-all}.term .tm{color:#8B949E}
.tcp{margin-top:4px;padding:3px 8px;border-radius:6px;background:#ffffff14;color:#C9D1D9!important;font:600 10px/14px var(--f)}

/* ---------- 21. NETWORK MONITOR (outside the phone; team-only) ---------- */
body.np-on .stage{padding-right:436px}
.netp{position:fixed;top:56px;right:0;bottom:0;width:420px;z-index:50;display:flex;flex-direction:column;background:#141619;border-left:1px solid #000;color:#d6d9de;font:500 12px/16px -apple-system,var(--f);box-shadow:-20px 0 40px -20px #000}
@media (max-width:900px){.netp{width:100%}body.np-on .stage{padding-right:16px}}
.np-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #000}
.np-t{display:grid;gap:2px}.np-t b{font:700 15px/18px -apple-system,var(--f);color:#fff}.np-t span{color:#8b919a}
.np-x{width:28px;height:28px;border-radius:8px;background:#22262b;color:#c9ced6}
.np-c{display:grid;gap:8px;padding:12px 16px;border-bottom:1px solid #000}
.np-seg{display:grid;grid-template-columns:1fr 1fr;background:#22262b;border-radius:8px;padding:3px}
.np-seg button{padding:6px;border-radius:6px;color:#a1a7b0;font-weight:600}.np-seg button.on{background:#3a3f46;color:#fff}
.np-in{width:100%;background:#0d0f11;border:1px solid #2a2f35;border-radius:8px;padding:7px 10px;color:#e6e8eb;font:500 12px/16px var(--m);outline:0}
.np-in:focus{border-color:#4c9bff}.np-row{display:flex;gap:8px}
.np-b{padding:6px 10px;border-radius:8px;background:#22262b;color:#d6d9de;font-weight:600;white-space:nowrap}
.np-stats{display:flex;gap:12px;flex-wrap:wrap;color:#8b919a}.np-stats b{color:#e6e8eb}.np-stats .ok b{color:#5be39c}.np-stats .er b{color:#ff8589}
.np-list{flex:1;overflow:auto}
.np-r{display:grid;grid-template-columns:52px 1fr auto auto;grid-template-rows:auto auto;column-gap:8px;width:100%;text-align:left;padding:8px 16px;border-bottom:1px solid #1d2024}
.np-r:hover{background:#1b1e22}.np-r.sel{background:#1f2b3d}.np-r.bad .np-s{color:#ff8589}.np-r.pend{opacity:.8}
.np-m{font:700 10px/1 var(--m);padding:4px 0;border-radius:4px;text-align:center;background:#1f3550;color:#8dbdff;align-self:center}
.np-m.POST{background:#173c2a;color:#5be39c}.np-m.PATCH{background:#3d3214;color:#ffc44d}.np-m.DELETE{background:#43191b;color:#ff8589}
.np-p{font:500 12px/16px var(--m);color:#e6e8eb;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;align-self:center}
.np-s{font:700 12px/16px var(--m);color:#5be39c;align-self:center}.np-ms{color:#8b919a;align-self:center;min-width:48px;text-align:right}
.np-tm{grid-column:2/5;color:#6b7179;font-size:11px}
.np-spin{display:inline-block;width:10px;height:10px;border-radius:50%;border:2px solid #8dbdff;border-right-color:transparent;animation:rot .8s linear infinite}
.np-empty{padding:28px 16px;text-align:center;color:#6b7179}
.np-d{max-height:48%;overflow:auto;border-top:1px solid #000;background:#0f1113;padding:12px 16px;display:grid;gap:8px}
.np-dh{display:flex;gap:8px;align-items:center}.np-dh b{color:#fff}.np-dh span:not(.np-m){color:#8b919a;flex:1}.np-dh .np-m{width:52px}
.np-url{font:500 11px/16px var(--m);color:#79c0ff;word-break:break-all}
.np-l{color:#8b919a;text-transform:uppercase;letter-spacing:.06em;font-size:10px}
.np-d pre{margin:0;font:500 11px/16px var(--m);color:#c9d1d9;white-space:pre-wrap;word-break:break-all;background:#0a0c0e;border:1px solid #1d2024;border-radius:8px;padding:10px}

</style>

<script>
/* =====================================================================
   STARTER engine.js — production-prototype skill (proven on Biko + Kilo)
   Provides: $ $$ ic() bd() · sound bus (ac/tone/bell/warm/gate/MOMENT) · hap() + HLOG
             router (go/rerender/stagger/sliver/heroReact) · Dynamic Island (island/closeIsland/LIVE hooks) + ISLLOG
             sheet()/closeSheet() · ripple + selection haptics · seg()/segBind() · swipe() · chrome (tabs/mute/home/reset/fit/bump)
   Your app.js must define BEFORE this file runs its last line (boot()):
     R={},A={}           screen render / bind functions
     APP={tabs:[...], home:"today", theme:scr=>"dark"|"light"|..., noLive:[...screens hiding the live pill], bumpIds:[...]}
     SFX={...}            outcome cues (start from SFX_BASE below)
     init()               builds S and calls go(first)
     LIVE (optional)      {on:()=>bool, compact:()=>html, card:()=>html, bind:(el)=>void} for an ongoing session
   Expose to window for QA: go, S-reading helpers, sheets.
   ===================================================================== */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const V=$("#view"),TABS=$("#tabs"),PH=$("#phone");
/* Solar: bold duotone by default (tiles, active, island); linear for "s", "xs", "lin" (inline + chrome) */
const ic=(n,c="")=>`<svg class="ic ${c}" aria-hidden="true"><use href="#i-${n}${/(^| )(s|xs|lin)( |$)/.test(c)?"-l":""}"/></svg>`;
const bd=(txt,kind="",icon="")=>`<span class="badge t-label ${kind}">${icon?ic(icon,"xs"):""}${txt}</span>`;

/* ================= SOUND (Web Audio, no assets) ================= */
let AC=null,muted=false,BUS=null,REV=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();
    const comp=AC.createDynamicsCompressor();comp.threshold.value=-20;comp.knee.value=12;comp.ratio.value=4;comp.attack.value=.003;comp.release.value=.15;
    const mg=AC.createGain();mg.gain.value=.6;comp.connect(mg).connect(AC.destination);BUS=comp;
    const len=AC.sampleRate*1.1,ir=AC.createBuffer(2,len,AC.sampleRate);for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2)}
    REV=AC.createConvolver();REV.buffer=ir;const rg=AC.createGain();rg.gain.value=.2;REV.connect(rg).connect(comp)}catch{return null}}
  if(AC.state==="suspended")AC.resume();return AC}
function route(c,node,o){let n=node;if(o.lp){const f=c.createBiquadFilter();f.type="lowpass";f.frequency.value=o.lp;n.connect(f);n=f}
  n.connect(BUS);if(o.rev){const g=c.createGain();g.gain.value=o.rev;n.connect(g).connect(REV)}}
function tone(f,d=.08,type="sine",v=.12,when=0,to=null,o={}){if(muted)return;const c=ac();if(!c)return;const t=c.currentTime+when;
  const os=c.createOscillator(),g=c.createGain();os.type=type;os.frequency.setValueAtTime(f,t);if(to)os.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+(o.a||.006));g.gain.exponentialRampToValueAtTime(.0001,t+d);os.connect(g);route(c,g,o);os.start(t);os.stop(t+d+.03)}
function bell(f,d=.5,v=.07,when=0,rev=.3){tone(f,d,"sine",v,when,null,{rev,a:.004});tone(f*2.01,d*.55,"sine",v*.32,when,null,{rev});tone(f*3.92,d*.22,"sine",v*.1,when,null,{rev})}
const warm=(f,d,v,when=0,o={})=>tone(f,d,"sine",v,when,null,Object.assign({lp:2400,a:.012,rev:.18},o));
const GATE={};const gate=(k,ms)=>{const n=performance.now();if(GATE[k]&&n-GATE[k]<ms)return false;GATE[k]=n;return true};
const MOMENT=()=>gate("moment",220);
/* haptics: Apple-HIG vocabulary, rate-limited; notifications share one 300ms gate */
const HAPT={select:[3],light:[6],soft:[9],medium:[12],rigid:[7],heavy:[18],success:[8,70,16],warning:[16,90,16],error:[20,50,20,50,26]};
const HGAP={select:30,light:45,soft:60,medium:80,rigid:60,heavy:120,success:300,warning:300,error:300};
const HLOG=[];
const buzz=ms=>{try{if(navigator.userActivation?.hasBeenActive&&navigator.vibrate)navigator.vibrate(ms)}catch{}};
function hap(k){if(typeof S!=="undefined"&&S&&S.haptics===false)return;const p=HAPT[k];if(!p)return;if(!gate("h-"+(p.length>1?"n":k),HGAP[k]))return;HLOG.push(k);buzz(p);
  if(k==="error"||k==="warning"||k==="success"||k==="heavy"){const d=$("#device");d.classList.remove("hx-"+k);void d.offsetWidth;d.classList.add("hx-"+k);setTimeout(()=>d.classList.remove("hx-"+k),420)}}
/* plate clack: rubber bumper on platform — low thud + tiny steel tick */
/* generic outcome cues — copy into your SFX and add 2–3 domain one-shots (see motion-sound-haptics.md) */
const SFX_BASE={
  ok(){if(!MOMENT())return;warm(659,.32,.05);warm(988,.42,.045,.09);hap("medium")},
  success(){if(!MOMENT())return;[523,659,784].forEach((f,i)=>warm(f,.55,.045,i*.11,{rev:.28}));warm(1047,.8,.035,.33,{rev:.35});hap("success")},
  err(){if(!MOMENT())return;tone(330,.18,"triangle",.045,0,294,{lp:1200,a:.012});tone(262,.26,"triangle",.045,.16,233,{lp:1000,a:.012});hap("error")},
  alert(){if(!MOMENT())return;warm(784,.35,.045);warm(587,.5,.045,.16);hap("warning")},
  copy(){if(!gate("copy",500))return;warm(1760,.1,.03,0,{lp:3600,rev:.1});warm(2349,.16,.025,.06,{lp:3600,rev:.15});hap("light")},
  empty(){if(!MOMENT())return;warm(392,.3,.03,0,{lp:1400});warm(330,.45,.028,.12,{lp:1200});hap("soft")},
  allow(){if(!MOMENT())return;warm(784,.2,.035,0,{lp:3000});warm(1047,.35,.03,.08,{lp:3200,rev:.25});hap("success")},
  deny(){if(!gate("deny",300))return;warm(523,.2,.022,0,{lp:1800});warm(440,.3,.02,.08,{lp:1600});hap("soft")},
  bye(){if(!MOMENT())return;[784,659,523].forEach((f,i)=>warm(f,.4,.04,i*.12,{lp:2200,rev:.3}));hap("medium")},
  tick(){if(!gate("rtick",600))return;warm(1568,.08,.012,0,{lp:3600,rev:.05})},
  expand(){if(!gate("expand",250))return;tone(440,.25,"sine",.018,0,880,{lp:2200,a:.03});hap("light")},
  collapse(){if(!gate("expand",250))return;tone(880,.2,"sine",.016,0,440,{lp:2000,a:.03});hap("soft")},
};

/* ================= ROUTER ================= */
let S;
function setTheme(scr){PH.dataset.theme=APP.theme(scr)}
function go(scr,dir){S.scr=scr;dir=dir||"f";
  const t=APP.tabs.indexOf(scr),tabbed=t>=0;TABS.hidden=!tabbed;PH.classList.toggle("notabs",!tabbed);
  $$(".tabs button").forEach((b,i)=>{const on=i===t;b.classList.toggle("on",on);b.querySelector("use").setAttribute("href",`#i-${b.dataset.ic}${on?"":"-l"}`)});
  const ind=$("#tabind");ind.style.transform=`translateX(${Math.max(t,0)*100}%)`;ind.style.opacity=t<0?0:1;
  setTheme(scr);PH.classList.toggle("nosf",!!(APP.full||[]).includes(scr));
  V.className="view"+((APP.full||[]).includes(scr)?" full":"");void V.offsetWidth;V.classList.add(dir);V.scrollTop=0;
  V.innerHTML=R[scr]();stagger();(A[scr]||(()=>{}))();sliver();islandSync()}
function rerender(){const sc=V.scrollTop;V.classList.add("still");V.innerHTML=R[S.scr]();V.scrollTop=sc;(A[S.scr]||(()=>{}))();sliver();islandSync()}
function stagger(){V.querySelectorAll(".st").forEach((e,i)=>e.style.setProperty("--i",i))}
/* sliver: put cbar(title,back) first in a scrolling screen; it pins (top:-60px, see pitfalls) once the big title scrolls away */
const cbar=(title,back)=>`<div class="cbar ${back?"":"nb"}">${back||""}<b class="t-h ell">${title}</b></div>`;
function sliver(){const c=V.querySelector(".cbar");V.onscroll=c?()=>c.classList.toggle("on",V.scrollTop>52):null;if(c)c.classList.toggle("on",V.scrollTop>52)}
/* hero reacts to state: "stall" (error) · "hop" (success) · "rep"/custom (physical event); returns to "idle" */
function heroReact(cls,sel=".hero"){V.querySelectorAll(sel).forEach(h=>{h.classList.remove("rep","stall","hop","idle");void h.offsetWidth;h.classList.add(cls);setTimeout(()=>{h.classList.remove(cls);h.classList.add("idle")},1000)})}

/* ---------- Dynamic Island (engine from reference: queue, pre-grow, hover-pause, swipe-up dismiss, live activity) ---------- */
const TINT={ok:"var(--ok)",warn:"var(--warn)",info:"var(--info)",acc:"var(--acc)"};
const ISLQ=[],ISLLOG=[];let islShownAt=0,islQT=null,islT;
function island(title,sub,icon="check",bg="var(--ok)",ms=2800,act){ISLLOG.push({title,sub,icon,bg,act:act&&act.l});const I=$("#island");const age=performance.now()-islShownAt;
  if((I.classList.contains("open")||I.classList.contains("pre"))&&!I.classList.contains("closing")&&age<900){ISLQ.push([title,sub,icon,bg,ms,act]);clearTimeout(islQT);islQT=setTimeout(()=>{const n=ISLQ.shift();if(n)islandShow(...n)},900-age);return}
  islandShow(title,sub,icon,bg,ms,act)}
function islandShow(title,sub,icon="check",bg="var(--ok)",ms=2800,act){const I=$("#island"),IN=$("#islandIn");islShownAt=performance.now();

  <button class="fab press" id="ifab" aria-label="Start New Installation">${ic("plus")}</button>`};

R.replace=()=>{const r=S.rep;const title=r.veh?`${r.veh.reg} Replacement`:"Replace Device";
  if(r.step===4)return repSummary();
  return`${wtop(`Step ${r.step} of 3`,title)}${stepper(["Owner","Vehicle","Install"],r.step)}${[null,repOwner,repVeh,repInstall][r.step]()}
  ${r.step<3?`<div class="dock"><button class="btn brand press" id="rnx" ${(r.step===1?r.ok:r.veh&&r.reason&&(r.reason!=="Other (specify)"||r.other.trim()))?"":"disabled"}>Next ${ic("arrow-right","s")}</button></div>`:""}`};
A.replace=()=>{const r=S.rep;$("#fbk")&&($("#fbk").onclick=()=>{if(r.step===1){S.fam=null;go("home","b")}else{r.step--;go("replace","b")}});
  $("#rnx")&&($("#rnx").onclick=()=>{r.step++;hap("medium");go("replace")});[null,aRepOwner,aRepVeh,aRepInstall,aRepSum][r.step]()};
function repOwner(){const r=S.rep;
  if(r.ok){const o=r.owner;return`<div class="stack-1 st"><h1 class="t-title">Verify Owner (${esc(o.name)})</h1><span class="t-meta mute">Confirmed by OTP against the registered mobile number.</span></div>
    <div class="resume st" style="background:var(--ok-bg)"><span class="tile ok">${ic("shield")}</span><span class="stack-1"><b class="t-h">Identity Confirmed</b><span class="t-meta mute">Matched to the registered mobile number and OTP-verified.</span></span><button class="icon-btn press sm-ib" id="orm" aria-label="Delete">${ic("trash","s")}</button></div>
    <div class="devcard st"><div class="cust"><span class="ini-s">${initials(o.name)}</span><span class="stack-1"><b class="t-h">${esc(o.name)}</b><span class="t-meta mute">Owner</span></span><span></span></div>
      ${kvrows([["Registered Mobile",o.ph],["Fleet Owner",o.name],["Company",o.co],["Managing Dealer",o.dealer],["Distributor",o.dist]])}</div>`}
  const d=r.q.replace(/\D/g,""),L=d.length>=3?OWNERS.filter(o=>o.ph.replace(/\D/g,"").includes(d)):null;
  return`<div class="stack-1 st"><h1 class="t-title">Verify Owner</h1><span class="t-meta mute">Search the fleet owner's registered mobile number to begin.</span></div>
    <div class="stack-2 st"><label class="t-label up mute">Registered Mobile Number *</label><div class="field">${ic("phone","s")}<input id="oq" inputmode="numeric" placeholder="e.g. 9447012345" value="${esc(r.q)}"></div></div>
    ${r.otpSent?`<div class="card st" style="display:grid;gap:12px"><div class="cust"><span class="ini-s">${initials(r.owner.name)}</span><span class="stack-1"><b class="t-num">${esc(r.owner.name)}</b><span class="t-meta mute">${esc(r.owner.co)}</span></span><span></span></div>
        <span class="t-meta ok-t">OTP sent to ${esc(r.owner.ph)}. (Demo OTP: 4820)</span><div class="row"><div class="field grow"><input id="oot" inputmode="numeric" maxlength="4" placeholder="Enter OTP *" value="${esc(r.otp)}"></div><button class="btn brand sm press" id="ovf">Verify OTP</button></div></div>`
    :`<div class="txcard st">${!L?`<div class="empty" style="padding:16px">${ic("search","l")}<span class="t-meta mute">Type a registered mobile number to search.</span></div>`:L.length?L.map((o,i)=>`<button class="txr press" data-ow="${OWNERS.indexOf(o)}"><span class="ini-s">${initials(o.name)}</span><span class="main"><b class="t-num ell">${o.ph} — ${esc(o.name)}</b><span class="t-meta mute ell">${esc(o.co)} · ${o.n} vehicles</span></span><span class="end">${ic("chevron","s")}</span></button>`).join(""):`<div class="empty" style="padding:16px">${ic("user2","l")}<span class="t-meta mute">No owner found for that number.</span></div>`}</div>
      <span class="t-label mute st">Demo numbers: 94470 12345 · 98765 43210 · 99887 76543</span>`}`}
function aRepOwner(){const r=S.rep;const q=$("#oq");q&&(q.oninput=()=>{r.q=q.value;r.otpSent=false;clearTimeout(A.ot);A.ot=setTimeout(()=>{rerender();keepFocus("oq")},200)});
  V.querySelectorAll("[data-ow]").forEach(b=>b.onclick=async()=>{r.owner=OWNERS[+b.dataset.ow];b.querySelector(".end").innerHTML=`<span class="spin" style="color:var(--acc)"></span>`;await sleep(800);r.otpSent=true;hap("light");rerender()});
  $("#oot")&&($("#oot").oninput=e=>r.otp=e.target.value);
  $("#ovf")&&($("#ovf").onclick=()=>{if(r.otp!=="4820"){SFX.err();toast("Incorrect OTP. The demo OTP is 4820.","","warning","var(--warn)");return}r.ok=true;SFX.success();rerender()});
  $("#orm")&&($("#orm").onclick=()=>confirmSheet({icon:"trash",title:"Remove Verified Owner?",body:"You'll need to search and verify the owner's mobile number again.",ok:"Remove Owner",danger:true,run:async()=>{Object.assign(r,{owner:null,ok:false,otpSent:false,otp:""});rerender()}}))}
function repVeh(){const r=S.rep;
  if(!r.veh)return`<div class="stack-1 st"><h1 class="t-title">Vehicle &amp; Reason</h1><span class="t-meta mute">Pick the vehicle whose device is being replaced.</span></div>
    <div class="sec st"><span class="t-label up mute">Registered Vehicles</span><span class="t-meta mute">${CONFLICTS.length}</span></div>
    <div class="stack st">${CONFLICTS.map((c,i)=>`<button class="itile press" data-vh="${i}" style="grid-template-columns:auto 1fr auto"><span class="tile ${c.fam==="comp"?"amb":"acc"}">${ic("car")}</span><span class="stack-1" style="min-width:0">${plate(c.reg.replace(/\s/g,""))}<span class="t-meta mute ell">${famName(c.fam)} · ${c.model}</span></span><span class="end">${ic("chevron","s")}</span></button>`).join("")}</div>`;
  const c=r.veh,v=VAAHAN;
  return`<div class="stack-1 st"><h1 class="t-title">Vehicle &amp; Reason</h1><span class="t-meta mute">Confirm the vehicle's existing device and the reason it's being replaced.</span></div>
    <div class="devcard st"><div class="row"><span class="stack-1"><span class="t-label up mute">Vehicle</span>${plate(c.reg.replace(/\s/g,""),1)}</span><button class="btn ghost sm press" id="vch">Change</button></div>
      ${kvrows([["Registration Number",c.reg],["Owner",v.owner],["Make / Model",v.make+" "+v.model],["Chassis Number",v.chassis,1],["Fuel Type",v.fuel]])}</div>
    <div class="devcard st"><div class="devhead"><span class="tile warn">${ic("cpu")}</span><span class="stack-1"><b class="t-h">Existing Device — To Replace</b><span class="t-meta mute">This device will be swapped for the new one.</span></span><span></span></div>
      ${kvrows([["Model",c.model],["IMEI",c.imei,1],["Family",famName(c.fam)]])}</div>
    <div class="sec st"><span class="t-label up mute">Reason for Replacement *</span></div>
    <div class="stack-2 st">${REASONS.map(x=>`<button class="opt press ${r.reason===x?"on":""}" data-rs="${esc(x)}"><span class="rd"></span><span class="t-num">${x}</span><span></span></button>`).join("")}</div>
    ${r.reason==="Other (specify)"?`<div class="field st"><input id="roth" placeholder="Describe the reason" value="${esc(r.other)}"></div>`:""}
    <div class="stack-2 st"><span class="t-label up mute">Clarification Note (Optional)</span><div class="field"><input id="rnt" placeholder="Anything else worth noting" value="${esc(r.note)}"></div></div>`}
function aRepVeh(){const r=S.rep;V.querySelectorAll("[data-vh]").forEach(b=>b.onclick=()=>{r.veh=CONFLICTS[+b.dataset.vh];S.fam=r.veh.fam;setTheme("replace");hap("select");go("replace")});
  $("#vch")&&($("#vch").onclick=()=>{r.veh=null;r.reason="";rerender()});
  V.querySelectorAll("[data-rs]").forEach(b=>b.onclick=()=>{r.reason=b.dataset.rs;hap("select");rerender()});
  $("#roth")&&($("#roth").oninput=e=>{r.other=e.target.value;const n=$("#rnx");if(n)n.disabled=!r.other.trim()});$("#rnt")&&($("#rnt").oninput=e=>r.note=e.target.value)}
function repInstall(){const r=S.rep;const ph=["Uninstall","Register","Diagnostics"];
  const top=`<div class="phases st">${ph.map((p,i)=>`<span class="${i+1<r.ph?"done":i+1===r.ph?"cur":""}">${i+1<r.ph?ic("check","xs"):""}${p}</span>`).join("")}</div>`;
  if(r.ph===1)return`${top}<div class="stack-1 st"><h1 class="t-title">Uninstall the Existing Device</h1><span class="t-meta mute">Confirm each safety step before removing the old device.</span></div>
    <div class="stack-2 st">${[["ign","Ignition is OFF","key"],["harn","Wiring harness disconnected","plug"],["unm","Old unit unmounted","cpu"]].map(([k,l,i])=>`<button class="decl card press" data-ck="${k}"><span class="cbx ${r.chk[k]?"on":""}">${r.chk[k]?ic("check","xs"):""}</span><span class="tile sm">${ic(i,"s")}</span><b class="t-num">${l}</b></button>`).join("")}</div>
    <div class="dock"><button class="btn brand press" id="p1" ${r.chk.ign&&r.chk.harn&&r.chk.unm?"":"disabled"}>Continue to Register ${ic("arrow-right","s")}</button></div>`;
  if(r.ph===2){const ok=(r.mode==="imei"?r.imei.length>=15:r.uin.length>=6)&&r.iccid.trim()&&r.op;return`${top}<div class="stack-1 st"><h1 class="t-title">Register the New Device</h1><span class="t-meta mute">Enter the replacement device details.</span></div>
    <span class="t-label up mute st">Device Type *</span>${seg("dt",[["Discovery 4G","Discovery 4G"],["iCompass 2G","iCompass 2G"]],r.devType)}
    ${seg("rm",[["imei","IMEI"],["uin","UIN"]],r.mode)}
    ${r.mode==="imei"?`<div class="stack-2 st"><label class="t-label up mute">IMEI Number *</label><div class="field">${ic("barcode","s")}<input id="ri" inputmode="numeric" placeholder="Enter 15-digit IMEI number" value="${esc(r.imei)}" style="font-family:var(--m)"><button class="scanb" id="rsc" aria-label="Scan">${ic("qr","s")}</button></div></div>`
      :`<div class="stack-2 st"><label class="t-label up mute">UIN *</label><div class="field">${ic("doc","s")}<input id="ru" placeholder="e.g. UIN-CMP-42437758" value="${esc(r.uin)}" style="font-family:var(--m)"></div></div>`}
    <div class="stack-2 st"><label class="t-label up mute">SIM ICCID *</label><div class="field">${ic("sim","s")}<input id="rcc" placeholder="Enter SIM ICCID" value="${esc(r.iccid)}" style="font-family:var(--m)"></div></div>
    <span class="t-label up mute st">Telecom Operator *</span><div class="chips st">${["Airtel","Jio","Idea","BSNL"].map(o=>`<button class="chip ${r.op===o?"on":""}" data-op="${o}">${o}</button>`).join("")}</div>
    <div class="dock"><button class="btn brand press" id="p2" ${ok?"":"disabled"}>Register &amp; Continue ${ic("arrow-right","s")}</button></div>`}
  const K=["Power","Cellular","GPS","Server"],done=K.every(k=>r.diag[k]==="Passed");
  return`${top}<div class="stack-1 st"><h1 class="t-title">Run Diagnostics</h1><span class="t-meta mute">Verifying the new device is online and reporting.</span></div>
    <div class="stg st" style="height:190px"><div class="floor"></div><div class="hero ${done?"hop":"scan"}" style="bottom:14px;width:240px">${heroSVG(r.devType.startsWith("iCompass")?"comp":"disc")}</div></div>
    <div class="txcard st">${K.map(k=>{const st=r.diag[k]||"Pending";return`<div class="chk ${st==="Passed"?"pass":st==="Checking..."?"run":"next"}"><span class="st-ic">${st==="Passed"?ic("check","s"):st==="Checking..."?`<span class="spin"></span>`:ic({Power:"batt",Cellular:"wifi",GPS:"gps",Server:"server"}[k],"s")}</span><span class="main"><b class="t-num">${k}</b></span>${bd(st,st==="Passed"?"ok":st==="Checking..."?"acc":"")}</div>`}).join("")}</div>
    <div class="dock"><button class="btn brand press" id="p3" ${done?"":"disabled"}>Proceed to Summary ${ic("arrow-right","s")}</button></div>`}
function aRepInstall(){const r=S.rep;
  V.querySelectorAll("[data-ck]").forEach(b=>b.onclick=()=>{r.chk[b.dataset.ck]=!r.chk[b.dataset.ck];hap(r.chk[b.dataset.ck]?"light":"soft");rerender()});
  $("#p1")&&($("#p1").onclick=()=>{r.ph=2;go("replace")});
  segBind(V,"[data-seg=dt]",v=>{r.devType=v;S.fam=v.startsWith("iCompass")?"comp":"disc";setTheme("replace")});segBind(V,"[data-seg=rm]",v=>{r.mode=v;rerender()});
  const chk=()=>{const b=$("#p2");if(b)b.disabled=!((r.mode==="imei"?r.imei.length>=15:r.uin.length>=6)&&r.iccid.trim()&&r.op)};
  $("#ri")&&($("#ri").oninput=e=>{r.imei=e.target.value.replace(/\D/g,"");chk()});$("#ru")&&($("#ru").oninput=e=>{r.uin=e.target.value;chk()});$("#rcc")&&($("#rcc").oninput=e=>{r.iccid=e.target.value;chk()});
  $("#rsc")&&($("#rsc").onclick=()=>permGate("camera",()=>{r.imei=r.devType.startsWith("iCompass")?"860733242437758":"860012345678977";hap("rigid");rerender()}));
  V.querySelectorAll("[data-op]").forEach(b=>b.onclick=()=>{r.op=b.dataset.op;hap("select");rerender()});
  $("#p2")&&($("#p2").onclick=async()=>{r.ph=3;r.diag={};go("replace");for(const k of["Power","Cellular","GPS","Server"]){r.diag[k]="Checking...";rerender();await sleep(700);r.diag[k]="Passed";hap("light");if(S.scr==="replace")rerender()}SFX.success()});
  $("#p3")&&($("#p3").onclick=()=>{r.step=4;go("replace")})}
function repSummary(){const r=S.rep,c=r.veh;return`<div class="confetti">${Array.from({length:30},(_,i)=>`<i style="left:${(i*37)%100}%;background:${["var(--acc)","var(--ok)","var(--amb)","var(--info)"][i%4]};animation-delay:${(i%7)*.08}s;--dx:${((i*53)%120)-60}px;--r:${(i*97)%720}deg"></i>`).join("")}</div>
  <div class="stack center st" style="margin-top:8px"><span class="tile lg ok" style="width:72px;height:72px;border-radius:24px">${ic("replace","l")}</span><h1 class="t-title">Device Replaced!</h1><span class="t-meta mute">${esc(c.reg)} is back online on its new device.</span></div>
  <div class="swap st"><div class="swc out"><span class="t-label up">Removed</span><b class="t-num">${esc(c.model)}</b><span class="t-label t-mono">IMEI: ${c.imei}</span></div><span class="swa">${ic("arrow-right","s")}</span>
    <div class="swc in"><span class="t-label up">Installed</span><b class="t-num">${r.devType}</b><span class="t-label t-mono">${r.mode==="imei"?"IMEI: "+r.imei:"UIN: "+esc(r.uin)}</span></div></div>
  <div class="card st" style="display:grid;gap:8px"><div class="row"><span class="t-label up mute">Replacement Reason</span><span class="t-label mute">Confirmed in step 2</span></div><b class="t-num">${esc(r.reason==="Other (specify)"?r.other:r.reason)}</b>${r.note?`<span class="t-meta mute">Note: ${esc(r.note)}</span>`:""}</div>
  <div class="stack-2 st"><span class="t-label up mute">Technician Remarks</span><div class="field" style="border-radius:18px;align-items:flex-start;padding:14px 16px"><textarea id="rsr" rows="3" style="flex:1;border:0;background:none;outline:0;color:inherit;font:500 15px/22px var(--f);resize:none" placeholder="Optional notes on the replacement...">${esc(r.remarks)}</textarea></div></div>
  <div class="dock"><button class="btn brand press" id="rdn">Return to Dashboard</button></div>`}
function aRepSum(){SFX.cert();$("#rsr").oninput=e=>S.rep.remarks=e.target.value;$("#rdn").onclick=()=>{S.fam=null;go("home","b")}}

/* =================== COMMANDS & DIAGNOSTICS =================== */
function startCmd(){S.cmd={step:1,fam:null,method:null,imei:"",uin:"",dev:null,err:"",busy:false,scan:null,res:{},fix:{},sig:2,secondary:false,adv:false,notes:"",con:[]};S.fam=null;go("cmd")}
const CMD_STEPS=["Identify","Scan","Fix","Report"];
R.cmd=()=>{const c=S.cmd;return`${wtop(`Step ${c.step} of 4`,"Commands &amp; Diagnostics")}${stepper(CMD_STEPS,c.step)}${[null,cmdIdentify,cmdScan,cmdFix,cmdReport][c.step]()}`};
A.cmd=()=>{const c=S.cmd;$("#fbk").onclick=()=>{if(c.step===1){if(c.dev)return confirmSheet({icon:"replace",title:"Do you want to change the device?",body:"You'll need to scan or enter the IMEI/UIN again.",ok:"Yes, Change",run:async()=>{c.dev=null;c.imei="";rerender()}});if(c.method&&c.fam==="comp"){c.method=null;return rerender()}if(c.fam){c.fam=null;S.fam=null;c.method=null;setTheme("cmd");return rerender()}S.fam=null;go("home","b")}else if(c.step===3||c.step===4){c.step--;go("cmd","b")}else{c.step=1;go("cmd","b")}};
  [null,aCmdId,aCmdScan,aCmdFix,aCmdRep][c.step]()};
function cmdIdentify(){const c=S.cmd;
  if(!c.fam)return`<div class="stack-1 st"><h1 class="t-title">Select Device Type</h1><span class="t-meta mute">Select iCompass or Discovery to choose the device.</span></div>
    ${[["comp","iCompass","AIS-140 · dual eSIM"],["disc","Discovery","4G IoT tracker"]].map(([f,t,s])=>`<button class="series press st" data-cf="${f}" data-theme="${f}"><span class="series-art">${heroSVG(f)}</span><span class="row"><span class="stack-1"><b class="t-h">${t}</b><span class="t-meta mute">${s}</span></span><span class="feat-go" style="width:40px;height:40px">${ic("arrow-right","s")}</span></span></button>`).join("")}`;
  if(c.fam==="comp"&&!c.method)return`<div class="stack-1 st"><h1 class="t-title">Identify iCompass Device</h1><span class="t-meta mute">Select IMEI or UIN to identify the device.</span></div>
    ${[["imei","IMEI Number","15-digit device number","barcode"],["uin","UIN Number","Unique Identification Number","doc"]].map(([k,t,s,i])=>`<button class="opt press st" data-cm="${k}"><span class="tile acc">${ic(i)}</span><span class="stack-1"><b class="t-h">${t}</b><span class="t-meta mute">${s}</span></span>${ic("chevron","s")}</button>`).join("")}`;
  if(c.dev){const d=c.dev,e=!!d.secondary_sim_provider;return`<div class="stack-1 st"><h1 class="t-title">Confirm ${famName(c.fam)} Device</h1><span class="t-meta mute">Check the device and SIM details, then confirm.</span></div>
    <div class="devcard st"><div class="devhead"><span class="tile acc">${ic("cpu")}</span><span class="stack-1"><b class="t-h">Device</b><span class="t-meta mute">${esc(d.device_model)}</span></span>${plate(d.vehicle_number)}</div>
      ${kvrows([["Device Model",d.device_model],["Device Type",d.device_type],["IMEI / Barcode",d.imei,1],["UIN",d.uin||"—",1],["Firmware",d.firmware_version],["Vehicle",fmtReg(d.vehicle_number)],["Device Expiry",ddmmyyyy(d.device_expiry)]])}</div>
    <div class="devcard st"><div class="devhead"><span class="tile info">${ic("sim")}</span><span class="stack-1"><b class="t-h">SIM</b><span class="t-meta mute">${e?"eSIM (Dual Profile)":"Physical SIM"}</span></span><span></span></div>
      ${kvrows([["SIM Type",e?"eSIM (Dual Profile)":"Physical SIM"],["ICCID",d.iccid,1],[e?"Primary Provider":"Provider",d.primary_sim_provider],[e?"Primary Number":"SIM Number",d.primary_sim_number,1]].concat(e?[["Secondary Provider",d.secondary_sim_provider],["Secondary Number",d.secondary_sim_number,1]]:[]).concat([["Activated On",ddmmyyyy(d.primary_sim_activation_date)]]))}</div>
    <div class="dock"><button class="btn brand press" id="csd">${ic("radar","s")} Start Diagnosis</button></div>`}
  const uin=c.method==="uin";
  return`<div class="stack-1 st"><h1 class="t-title">${uin?"Enter UIN Number":"Enter IMEI Number"}</h1><span class="t-meta mute">${uin?"Type the UIN printed on the device label.":"Type the 15-digit IMEI, or tap the scan icon to scan its barcode."}</span></div>
    <div class="field st ${c.err?"err":""}">${ic(uin?"doc":"barcode","s")}<input id="cim" ${uin?"":`inputmode="numeric"`} placeholder="${uin?"e.g. UIN-CMP-42437755":"Type 15-digit IMEI or tap scan"}" value="${esc(uin?c.uin:c.imei)}" style="font-family:var(--m)">${uin?"":`<button class="scanb" id="csc" aria-label="Scan">${ic("qr","s")}</button>`}</div>
    ${uin?`<span class="t-label mute st">UIN is applicable for iCompass 2G AIS-140 devices only. Backend resolves UIN → IMEI.</span>`:`<span class="t-label mute st">Demo: ${c.fam==="comp"?"868329085923443 (iCompass on KL 07 AB 1234)":"866123456789012 (Discovery on KA 01 AB 1234)"}</span>`}
    ${c.err?`<div class="resume st" style="background:var(--warn-bg)"><span class="tile warn">${ic("warning")}</span><span class="t-meta">${esc(c.err)}</span><span></span></div>`:""}
    <div class="dock"><button class="btn brand press" id="cvf" ${c.busy?"disabled":""}>${c.busy?`<span class="spin"></span>`:""} ${uin?"Lookup UIN":"Verify IMEI"}</button></div>`}
function aCmdId(){const c=S.cmd;V.querySelectorAll("[data-cf]").forEach(b=>b.onclick=()=>{c.fam=b.dataset.cf;S.fam=c.fam;c.method=c.fam==="disc"?"imei":null;setTheme("cmd");hap("medium");rerender()});
  V.querySelectorAll("[data-cm]").forEach(b=>b.onclick=()=>{c.method=b.dataset.cm;hap("select");rerender()});
  $("#cim")&&($("#cim").oninput=e=>{if(c.method==="uin")c.uin=e.target.value;else c.imei=e.target.value.replace(/\D/g,"");c.err=""});
  $("#csc")&&($("#csc").onclick=()=>permGate("camera",()=>{c.imei=c.fam==="comp"?"868329085923443":"866123456789012";hap("rigid");rerender();cmdVerify()}));
  $("#cvf")&&($("#cvf").onclick=cmdVerify);$("#csd")&&($("#csd").onclick=()=>{c.step=2;c.scan=null;go("cmd");runScan()})}
async function cmdVerify(){const c=S.cmd;c.busy=true;c.err="";rerender();const q=c.method==="uin"?"868329085923443":c.imei;

      <span class="np-m ${r.m}">${r.m}</span><span class="np-p">${esc(r.path)}</span><span class="np-s">${st==="…"?'<i class="np-spin"></i>':st}</span><span class="np-ms">${st==="…"?"":r.ms+" ms"}</span><span class="np-tm">${npTime(r.t)} · ${r.src}</span></button>`}).join("")
    :`<div class="np-empty">${NET.length?"No calls match the filter.":"No requests yet. Use the app — every API call appears here live."}</div>`;
  NPE.list.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{NP.sel=NET[+b.dataset.i];npPaint()});
  const r=NP.sel;NPE.d.hidden=!r;if(r)NPE.d.innerHTML=`<div class="np-dh"><span class="np-m ${r.m}">${r.m}</span><b>${r.st}</b><span>${r.ms} ms · ${r.src}</span><button class="np-b" id="npcurl">Copy cURL</button><button class="np-x" id="npdx" aria-label="Close details">✕</button></div>
    <code class="np-url">${esc(CFG.base+CFG.prefix+r.path)}</code>
    ${r.req?`<span class="np-l">Request body</span><pre>${esc(JSON.stringify(r.req,null,2))}</pre>`:""}<span class="np-l">Response</span><pre>${r.res?esc(JSON.stringify(r.res,null,2)):"waiting…"}</pre>`;
  if(r){$("#npdx").onclick=()=>{NP.sel=null;npPaint()};$("#npcurl").onclick=()=>{try{navigator.clipboard.writeText(`curl -X ${r.m} '${CFG.base}${CFG.prefix}${r.path}' -H 'Authorization: Bearer <token>'${r.req?` -H 'Content-Type: application/json' -d '${JSON.stringify(r.req)}'`:""}`)}catch{}$("#npcurl").textContent="Copied"}}}
function npToggle(on){NP.open=on??!NP.open;NPE.p.hidden=!NP.open;document.body.classList.toggle("np-on",NP.open);fit();npPaint()}
/* live stream: repaint on every request start/finish (netLbl runs on both) */
const _netLbl=netLbl;netLbl=function(){_netLbl();npPaint()};
const _api=api;api=function(...a){const p=_api(...a);npPaint();return p};
NPE.mode.querySelectorAll("button").forEach(b=>b.onclick=()=>{CFG.live=b.dataset.v==="live";S.fbWarned=0;S.inst=null;S.saved=null;netLbl()});
NPE.base.value=CFG.base;NPE.base.onchange=()=>{CFG.base=NPE.base.value.trim();npPaint()};
NPE.q.oninput=()=>{NP.q=NPE.q.value;npPaint()};$("#npclr").onclick=()=>{NET.length=0;NP.sel=null;netLbl()};$("#npx").onclick=()=>npToggle(false);
/* keep the phone fitted beside the panel */
fit=function(){const pw=NP.open&&innerWidth>900?420:0,W=418,H=890,sc=Math.min(1,(innerWidth-32-pw)/W,(innerHeight-96)/H);$("#device").style.transform=`scale(${sc})`;$("#fit").style.width=W*sc+"px";$("#fit").style.height=H*sc+"px"};
$("#netbtn").onclick=()=>npToggle();
boot();

</script>
</body>
</html>
